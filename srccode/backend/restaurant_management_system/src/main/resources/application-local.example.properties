# Copy this file to application-local.properties. The copied file is ignored by Git.
# Supply sensitive values through environment variables; never place real secrets here.

spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=RestaurantManagementDB;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

payos.client-id=${PAYOS_CLIENT_ID}
payos.api-key=${PAYOS_API_KEY}
payos.checksum-key=${PAYOS_CHECKSUM_KEY}

app.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.jwt-secret=${JWT_SECRET}
app.cookie-secure=${COOKIE_SECURE:false}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
