spring.application.name=restaurant_management_system

server.port=8080

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=RestaurantManagementDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=@dmin123


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.profiles.active=local

# Mail config (Gmail App Password)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your_email@gmail.com
spring.mail.password=your_app_password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# PayOS Config (Dummy values to prevent startup crash)
payos.client-id=dummy_client_id
payos.api-key=dummy_api_key
payos.checksum-key=dummy_checksum_key

# App config
app.frontend-url=http://localhost:3000
app.jwt-secret=${JWT_SECRET:dev-only-change-this-jwt-secret-before-deploying-1234567890}
