spring.application.name=restaurant_management_system
server.port=${SERVER_PORT:8080}

# Use local unless an environment explicitly selects another profile.
spring.profiles.default=local

spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLE:true}

app.jwt-access-minutes=${JWT_ACCESS_MINUTES:15}
app.jwt-refresh-days=${JWT_REFRESH_DAYS:30}
