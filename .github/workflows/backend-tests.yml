name: Backend Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "srccode/backend/restaurant_management_system/**"
      - "db_migration_*.sql"
      - ".github/workflows/backend-tests.yml"
  push:
    branches: [main]
    paths:
      - "srccode/backend/restaurant_management_system/**"
      - "db_migration_*.sql"
      - ".github/workflows/backend-tests.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: srccode/backend/restaurant_management_system

jobs:
  fast-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run unit and H2 integration tests
        run: mvn --batch-mode --no-transfer-progress clean test
      - name: Upload failed test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-fast-test-reports
          path: srccode/backend/restaurant_management_system/target/surefire-reports

  sqlserver-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUN_SQLSERVER_TESTS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify SQL Server migrations in Testcontainers
        run: mvn --batch-mode --no-transfer-progress -Dtest.excluded-groups=none -Dgroups=integration -Dtest=SqlServerMigrationIntegrationTest test
      - name: Upload failed integration reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-sqlserver-test-reports
          path: srccode/backend/restaurant_management_system/target/surefire-reports
